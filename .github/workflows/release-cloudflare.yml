name: Release & Deploy to Cloudflare Workers

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional version label (defaults to package version / commit SHA)"
        required: false
        default: "1.0.0"

permissions:
  contents: write

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  pre-release-gates:
    name: Pre-Release DevSecOps Verification Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Compliance, Lint & Build Gates
        run: |
          npm run lint
          npm run build
          npx esbuild worker/index.ts --bundle --format=esm --platform=browser --outfile=/tmp/swarakala-worker.mjs
          node scripts/verify-repo-compliance.mjs --with-dist

  deploy-cloudflare-workers:
    name: Deploy Edge App to Cloudflare Workers
    runs-on: ubuntu-latest
    needs: [pre-release-gates]
    environment:
      name: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Required Deployment Secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$CF_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "$CF_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)
          test -n "$GEMINI_API_KEY" || (echo "Missing GEMINI_API_KEY secret" && exit 1)

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies & Build Production Bundle
        run: |
          npm ci
          npm run build

      - name: Sync Runtime API Secret to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Deploy Worker & Static Assets to Cloudflare Workers
        id: cf_deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Publish Signed GitHub Release on Tag Push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            CHANGELOG.md
            SECURITY.md
